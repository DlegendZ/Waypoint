name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

defaults:
  run:
    working-directory: App

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Checkstyle
        run: ./mvnw -B checkstyle:check

  test:
    name: Test
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      # Docker is preinstalled and running on ubuntu-latest runners, so the Testcontainers-backed
      # integration tests (Day 19) work with no extra "services:" setup - they start their own
      # throwaway Postgres/Redis containers exactly like they do locally.
      - name: Run tests
        run: ./mvnw -B test
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: App/target/surefire-reports
          retention-days: 7

  build:
    name: Build Docker image
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Builds the same multi-stage Dockerfile from Day 22 - this doubles as the strongest possible
      # "does the app actually build and package correctly" check, independent of the Maven test JVM.
      - name: Build image
        run: docker build -t waypoint-app:${{ github.sha }} .

  deploy:
    name: Deploy
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # TODO (Day 24): wire up the real deploy target (Railway/Render). Kept as an explicit,
      # non-destructive placeholder for now so the pipeline shape (lint -> test -> build -> deploy,
      # each gated on the previous succeeding) is in place before credentials/target exist.
      - name: Deploy (placeholder)
        run: |
          echo "Build ${{ github.sha }} passed lint, test, and build."
          echo "Deploy step not wired up yet - see Day 24."
